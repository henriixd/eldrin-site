name: MyChat APK
on:
  push:
    paths: ['_mychat-android/**', '.github/workflows/mychat-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Chave fixa de assinatura (fica guardada no cache privado do GitHub)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mychat-debug-keystore-v1
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build APK
        working-directory: _mychat-android
        run: gradle assembleDebug --no-daemon
      - name: Publish APK
        run: |
          cp _mychat-android/app/build/outputs/apk/debug/app-debug.apk mychat/MyChat.apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add mychat/MyChat.apk
          git commit -m "MyChat: APK atualizado" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mychat-apk
          name: MyChat APK
          files: mychat/MyChat.apk
          make_latest: false
